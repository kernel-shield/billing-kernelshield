<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel Shield | Billing Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Generador de QR y Cliente Supabase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 shadow-lg flex justify-between items-center">
        <div class="font-bold text-xl flex items-center gap-2">
            <i class="fa-solid fa-shield-halved"></i> Kernel Shield Billing
        </div>
        <div id="user-info" class="hidden">
            <span id="user-email" class="mr-4 text-sm font-semibold"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Salir</button>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container mx-auto p-6 mt-8 max-w-5xl" id="app">
        <!-- Pantalla de Login (Se muestra si no hay sesión) -->
        <div id="login-view" class="max-w-md mx-auto bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700">
            <h2 class="text-2xl font-bold mb-6 text-blue-400 text-center">Acceso al Panel</h2>
            <input type="email" id="email" placeholder="Correo electrónico" class="w-full bg-slate-700 p-3 rounded mb-4 outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="password" placeholder="Contraseña" class="w-full bg-slate-700 p-3 rounded mb-6 outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded font-bold transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar / Registrarse
            </button>
        </div>

        <!-- Panel del Cliente (Se muestra tras iniciar sesión) -->
        <div id="client-view" class="hidden grid md:grid-cols-2 gap-8">
            <!-- Formulario de Pago -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-xl font-bold text-blue-400 mb-4 border-b border-slate-700 pb-2">Registrar Pago</h3>
                <select id="service" class="w-full bg-slate-700 p-3 rounded mb-4 outline-none">
                    <option value="VPS KVM">VPS KVM (2 Cores, 3.5GB RAM)</option>
                    <option value="Server SA-MP">Servidor Dedicado SA-MP</option>
                </select>
                <input type="number" id="amount" placeholder="Monto en COP" class="w-full bg-slate-700 p-3 rounded mb-4 outline-none">
                <button onclick="submitPayment()" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded font-bold transition">
                    Enviar a Revisión 🚀
                </button>
            </div>

            <!-- Pago Nequi -->
            <div class="bg-gradient-to-br from-blue-700 to-blue-900 p-6 rounded-xl text-center flex flex-col items-center">
                <h3 class="text-xl font-bold mb-2">📱 Pago vía Nequi</h3>
                <p class="text-blue-200 text-sm mb-4">Escanea o envía a este número</p>
                <div class="bg-white p-3 rounded-xl mb-4">
                    <div id="qrcode"></div>
                </div>
                <div class="bg-black/30 px-6 py-2 rounded-full font-mono text-xl font-bold tracking-widest">
                    3128482212
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script src="app.js"></script>
</body>
</html>
