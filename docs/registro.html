<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | Kernel Shield</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> Kernel Shield · Panel</a>
    <nav><a href="login.html">Iniciar sesión</a></nav>
  </div>

  <div class="wrap-narrow">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Registro real, guardado en la base de datos.</p>

    <form id="regForm" class="card">
      <label for="first">Nombre</label>
      <input type="text" id="first" required>

      <label for="last">Apellido</label>
      <input type="text" id="last" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="country">País</label>
      <input type="text" id="country">

      <label for="discord">Usuario de Discord (opcional)</label>
      <input type="text" id="discord">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required minlength="6">

      <button type="submit" style="width:100%; margin-top:20px;">Crear cuenta</button>
      <div id="msg"></div>
    </form>
    <p class="subtitle">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
  </div>

  <script src="js/core.js"></script>
  <script>
    const form = document.getElementById('regForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const data = await KS.apiFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            first: document.getElementById('first').value.trim(),
            last: document.getElementById('last').value.trim(),
            email: document.getElementById('email').value.trim(),
            country: document.getElementById('country').value.trim(),
            discord: document.getElementById('discord').value.trim(),
            password: document.getElementById('password').value
          })
        });
        KS.setSession(data.token, data.user);
        window.location.href = 'panel.html';
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
