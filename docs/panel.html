<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi panel | Kernel Shield</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> Kernel Shield · Panel</a>
    <nav>
      <span id="userLabel" style="color:var(--text-dim);font-size:14px;margin-right:14px;"></span>
      <a href="#" id="logoutLink">Cerrar sesión</a>
    </nav>
  </div>

  <div class="wrap">
    <h1>Mi panel</h1>
    <p class="subtitle">Tus suscripciones activas y el estado de tus pagos.</p>

    <h2>Suscripciones</h2>
    <div id="subsBox" class="card"><p class="empty">Cargando...</p></div>

    <h2>Reportar un pago</h2>
    <form id="payForm" class="card">
      <label for="plan_id">Plan</label>
      <select id="plan_id" required></select>

      <label for="metodo_pago">Método de pago</label>
      <select id="metodo_pago" required></select>
      <p id="metodoDatos" class="subtitle" style="margin:6px 0 0; font-size:13px;"></p>

      <label for="monto">Monto pagado</label>
      <input type="number" id="monto" step="0.01" min="0" required>

      <label for="referencia">Referencia / hash de transacción (opcional)</label>
      <input type="text" id="referencia">

      <label for="comprobante">Captura del comprobante (opcional)</label>
      <input type="file" id="comprobante" accept="image/*,.pdf">

      <button type="submit" style="margin-top:20px;">Reportar pago</button>
      <div id="payMsg"></div>
    </form>

    <h2>Historial de pagos</h2>
    <div id="pagosBox" class="card"><p class="empty">Cargando...</p></div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
