<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | Kernel Shield</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--shield-dim), var(--bg-panel));
    border: 1px solid var(--border);
    color: var(--shield);
    font-family: var(--font-mono);
    font-size: 18px;
    margin-bottom: 18px;
    box-shadow: var(--glow-shield);
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> Kernel Shield · Panel</a>
    <nav><a href="registro.html">Crear cuenta</a></nav>
  </div>

  <div class="wrap-narrow">
    <div class="auth-icon">🛡</div>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Entrá con tu cuenta para ver tu panel.</p>

    <form id="loginForm" class="card">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" style="width:100%; margin-top:20px;">Entrar</button>
      <div id="msg"></div>
    </form>
    <p class="subtitle">¿No tenés cuenta? <a href="registro.html">Registrate acá</a></p>
  </div>

  <script src="js/core.js"></script>
  <script>
    // Si ya hay sesión activa, redirigir directo
    const _u = KS.getUser();
    if (KS.getToken() && _u) {
      window.location.href = _u.rol === 'admin' ? 'admin.html' : 'panel.html';
    }

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const data = await KS.apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        KS.setSession(data.token, data.user);
        window.location.href = data.user.rol === 'admin' ? 'admin.html' : 'panel.html';
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
