<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planes | Kernel Shield</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> Kernel Shield · Panel</a>
    <nav>
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html">Crear cuenta</a>
    </nav>
  </div>

  <div class="wrap">
    <h1>Planes disponibles</h1>
    <p class="subtitle">Elegí un plan e iniciá sesión para reportar tu pago.</p>
    <div id="planesGrid" class="grid"><p class="empty">Cargando planes...</p></div>
  </div>

  <script src="js/core.js"></script>
  <script>
    async function cargarPlanes() {
      const grid = document.getElementById('planesGrid');
      try {
        const { planes } = await KS.apiFetch('/plans');
        if (!planes.length) {
          grid.innerHTML = '<p class="empty">No hay planes disponibles por ahora.</p>';
          return;
        }
        grid.innerHTML = planes.map(p => `
          <div class="plan-card">
            <div class="tipo">${p.tipo}</div>
            <h3>${p.nombre}</h3>
            <div class="precio">${KS.fmtMoney(p.precio, p.moneda)}<span> /mes</span></div>
            <div class="specs">${p.ram || ''} RAM · ${p.cpu || ''} · ${p.disco || ''}</div>
            <p class="subtitle" style="margin-bottom:14px; font-size:13px;">${p.descripcion || ''}</p>
            <a class="btn" href="login.html">Elegir este plan</a>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<div class="error-box">No se pudieron cargar los planes: ${err.message}</div>`;
      }
    }
    cargarPlanes();
  </script>
</body>
</html>
